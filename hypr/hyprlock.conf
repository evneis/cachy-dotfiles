# hyprlock — matches hyprland accent (orange) and Waybar font
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 0
    animation = fadeOut, 0
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/evan/Pictures/wallpapers/gr86_road.jpg
    fit_mode = cover
    brightness = 0.7
    contrast = 0.9
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(27, 27, 27, 0.75)

    # Match hyprland.conf active border: rgba(254,122,8) / rgba(27,27,27)
    outer_color = rgba(254, 122, 8, 0.85) rgba(27, 27, 27, 0.85) 45deg
    check_color = rgba(254, 122, 8, 0.95) rgba(254, 180, 80, 0.95) 120deg
    fail_color = rgba(200, 60, 40, 0.95) rgba(254, 122, 8, 0.95) 40deg

    font_color = rgb(230, 230, 230)
    fade_on_empty = false
    rounding = 5

    font_family = $font
    placeholder_text = <span foreground="##aaaaaa">Password...</span>
    fail_text = $PAMFAIL

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgba(255, 255, 255, 0.9)

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font
    color = rgba(254, 122, 8, 0.9)

    position = -30, -150
    halign = right
    valign = top
}
