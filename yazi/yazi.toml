[mgr]
show_hidden = true

[[mgr.prepend_keymap]]
on  = "y"
run = [ 'shell -- for path in %s; do echo "file://$path"; done | wl-copy -t text/uri-list', "yank" ]

[opener]
edit = [
    { run = 'kitty fish -c "nvim %s"', orphan = true, desc = "nvim", for = "unix" },
]
play = [
  { run = "vlc %s", orphan = true, for = "unix" },
]
image = [
  { run = "imv %s", orphan = true, desc = "imv", for = "unix" },
]
pdf = [
  { run = "tdf %s", block = true, desc = "tdf", for = "unix" },
]

[open]
prepend_rules = [
  { mime = "image/*", use = [ "image" ] },
  { mime = "application/pdf", use = [ "pdf" ] },
]
